<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
    </style>
</head>
<body>
    <h1>Results:</h1>
    <section></section>
    <script>
        var ourRequest = new XMLHttpRequest();

        ourRequest.open("GET", "index.json");
        
        ourRequest.onload = function() {
            var currJSON = JSON.parse(ourRequest.responseText);

            for (var i = 0; i < currJSON.items.length; i++) {
                var p = document.createElement("p");
                p.textContent = currJSON.items[i].title + "<br>" + currJSON.items[i].url;
                document.body.appendChild(p)
            }
            

        }

        ourRequest.send();
    </script>
</body>
</html>
